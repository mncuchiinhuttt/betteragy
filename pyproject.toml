[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betteragy"
version = "1.0.0"
description = "Rich CLI & TUI Switchboard & Token Analytics for Antigravity"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vo Minh Long", email = "vominhlongbentre@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
betteragy = "betteragy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/betteragy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
